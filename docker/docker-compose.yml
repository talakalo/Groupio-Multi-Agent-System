version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-groupio}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-groupio}"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file:
      - staging-minimal.env
    ports:
      - "8000:8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - QDRANT_URL=http://qdrant:6333
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-groupio-redis-dev}@redis:6379
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - USE_LOCAL_POSTGRES=${USE_LOCAL_POSTGRES:-1}
      # Docker network: use postgres service host. Pass components separately to avoid URL
      # encoding issues when password contains @ or spaces (Name or service not known).
      - DOCKER_POSTGRES_HOST=postgres
      - DOCKER_POSTGRES_USER=${POSTGRES_USER:-postgres}
      - DOCKER_POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - DOCKER_POSTGRES_DB=${POSTGRES_DB:-groupio}
      - RABBITMQ_URL=${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}
      - RABBITMQ_EXCHANGE_EVENTS=${RABBITMQ_EXCHANGE_EVENTS:-groupio.events}
    depends_on:
      postgres:
        condition: service_healthy
      # API does not wait on RabbitMQ: core routes work with messaging flags off.
      # Start rabbitmq separately when enabling ENABLE_RABBITMQ / workers.
      qdrant:
        condition: service_started
      neo4j:
        condition: service_started
      redis:
        condition: service_started
    volumes:
      - ../src:/app/src
    command: >
      sh -c "alembic upgrade head &&
      uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --reload"

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-groupio-redis-dev}
      --bind 0.0.0.0
      --protected-mode yes
      --appendonly yes
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file:
      - staging-minimal.env
    command: python -m src.workers.agent_worker
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-groupio-redis-dev}@redis:6379
      - QDRANT_URL=http://qdrant:6333
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - USE_LOCAL_POSTGRES=${USE_LOCAL_POSTGRES:-1}
      - DOCKER_POSTGRES_HOST=postgres
      - DOCKER_POSTGRES_USER=${POSTGRES_USER:-postgres}
      - DOCKER_POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - DOCKER_POSTGRES_DB=${POSTGRES_DB:-groupio}
      - RABBITMQ_URL=${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}
    depends_on:
      postgres:
        condition: service_healthy
      # Agent worker uses Redis only; no hard dependency on RabbitMQ.
      redis:
        condition: service_started
      qdrant:
        condition: service_started
      neo4j:
        condition: service_started

  scheduler:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: python -m src.workers.scheduler
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD:-groupio-redis-dev}@redis:6379
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-groupio}
      - QDRANT_URL=http://qdrant:6333
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started
      neo4j:
        condition: service_started
    restart: unless-stopped

  outbox_dispatcher:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file:
      - staging-minimal.env
    command: python -m src.workers.outbox_dispatcher
    environment:
      - USE_LOCAL_POSTGRES=${USE_LOCAL_POSTGRES:-1}
      - DOCKER_POSTGRES_HOST=postgres
      - DOCKER_POSTGRES_USER=${POSTGRES_USER:-postgres}
      - DOCKER_POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - DOCKER_POSTGRES_DB=${POSTGRES_DB:-groupio}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-groupio-redis-dev}@redis:6379
      - RABBITMQ_URL=${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}
      - ENABLE_RABBITMQ=${ENABLE_RABBITMQ:-false}
      - ENABLE_OUTBOX=${ENABLE_OUTBOX:-false}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  worker_notifications:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file:
      - staging-minimal.env
    command: python -m src.workers.worker_notifications
    environment:
      - USE_LOCAL_POSTGRES=${USE_LOCAL_POSTGRES:-1}
      - DOCKER_POSTGRES_HOST=postgres
      - DOCKER_POSTGRES_USER=${POSTGRES_USER:-postgres}
      - DOCKER_POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - DOCKER_POSTGRES_DB=${POSTGRES_DB:-groupio}
      - RABBITMQ_URL=${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}
      - ENABLE_RABBITMQ=${ENABLE_RABBITMQ:-false}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  worker_crm_sync:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file:
      - staging-minimal.env
    command: python -m src.workers.worker_crm_sync
    environment:
      - USE_LOCAL_POSTGRES=${USE_LOCAL_POSTGRES:-1}
      - DOCKER_POSTGRES_HOST=postgres
      - DOCKER_POSTGRES_USER=${POSTGRES_USER:-postgres}
      - DOCKER_POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - DOCKER_POSTGRES_DB=${POSTGRES_DB:-groupio}
      - RABBITMQ_URL=${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}
      - ENABLE_RABBITMQ=${ENABLE_RABBITMQ:-false}
      - ENABLE_CRM_SYNC=${ENABLE_CRM_SYNC:-false}
      - ESPOCRM_BASE_URL=${ESPOCRM_BASE_URL:-}
      - ESPOCRM_API_KEY=${ESPOCRM_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  worker_payments:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file:
      - staging-minimal.env
    command: python -m src.workers.worker_payments
    environment:
      - RABBITMQ_URL=${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}
      - ENABLE_RABBITMQ=${ENABLE_RABBITMQ:-false}
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped


  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      - NEXT_PUBLIC_ADMIN_URL=${NEXT_PUBLIC_ADMIN_URL:-http://localhost:3001}
    depends_on:
      api:
        condition: service_started

  admin:
    build:
      context: ..
      dockerfile: apps/admin/Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      - NEXT_PUBLIC_ADMIN_URL=${NEXT_PUBLIC_ADMIN_URL:-http://localhost:3001}
    depends_on:
      api:
        condition: service_started

  prometheus:
    image: prom/prometheus:v2.51.0
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ../monitoring/alerts.yml:/etc/prometheus/alerts.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --config.expand-env=true
    environment:
      # Valid URL required at parse time; override with a real Slack webhook in prod.
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-https://example.com/alertmanager-noop}
    volumes:
      - ../monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    ports:
      - "9093:9093"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.1
    # Host 3010 avoids clashing with Next.js Admin (localhost:3001).
    ports:
      - "3010:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data:
  neo4j_data:
  redis_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:
