# Flow: Login — Invalid Credentials
# Verifies that an error message appears for wrong credentials.
#
# Run: maestro test .maestro/flows/01-auth/login-invalid-credentials.yaml

appId: ${APP_ID}
tags:
  - auth
  - negative
---

- runFlow: ../../subflows/launch-fresh.yaml

- assertVisible:
    text: "Sign in to your account"
    timeout: 8000

# Enter wrong credentials
- tapOn:
    id: "login-email-input"
- inputText: "wrong@user.com"

- tapOn:
    id: "login-password-input"
- inputText: "WrongPassword999!"

- tapOn:
    id: "login-submit-button"

# Error message should appear
- assertVisible:
    text: "Login failed"
    timeout: 10000

# Should remain on the login screen
- assertVisible: "Sign in to your account"
- assertNotVisible: "Home"
