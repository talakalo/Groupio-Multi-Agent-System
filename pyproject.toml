[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "groupio-agents"
version = "1.0.0"
description = "Multi-agent AI system for Groupio marketplace"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Groupio", email = "dev@groupio.co.il"}
]

dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "email-validator>=2.1.0",
    "anthropic>=0.39.0",
    "openai>=1.6.0",
    "langchain>=0.1.0",
    "langchain-anthropic>=0.1.0",
    "langchain-openai>=0.0.5",
    "langchain-community>=0.0.10",
    "langgraph>=0.0.30",
    "qdrant-client>=1.7.0",
    "pinecone>=3.0.0",
    "neo4j>=5.15.0",
    "supabase>=2.3.0",
    "asyncpg>=0.29.0",
    "redis[hiredis]>=5.0.0",
    "aio-pika>=9.4.0",
    "httpx>=0.25.0",
    "python-multipart>=0.0.6",
    "tiktoken>=0.5.0",
    "numpy>=1.26.0",
    "tenacity>=8.2.0",
    "sentry-sdk[fastapi]>=1.39.0",
    "prometheus-client>=0.19.0",
    "PyJWT>=2.8.0",
    "aiosmtplib>=3.0.0",
    "resend>=2.0.0",
    "structlog>=23.2.0",
    "bcrypt>=4.0.0",
    "stripe>=7.0.0",
    "typing-extensions>=4.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "pytest-timeout>=2.2.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "httpx>=0.25.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov-fail-under=50 --timeout=120"  # Per-test timeout to avoid CI SIGTERM on slow/hanging tests

[tool.coverage.run]
# Temporarily omit the async-events scope shipped in PR #167 without tests.
# Each file here needs its own follow-up test PR; as tests land, entries are
# removed from this list and the CI threshold is raised back toward 80%.
# Tracked follow-up: #TODO-coverage-async-events
omit = [
    "src/messaging/connection.py",
    "src/messaging/constants.py",
    "src/messaging/publisher.py",
    "src/messaging/topology.py",
    "src/integrations/espocrm/client.py",
    "src/integrations/espocrm/service.py",
    "src/services/stripe_contractor_webhooks.py",
    "src/workers/outbox_dispatcher.py",
    "src/workers/worker_crm_sync.py",
    "src/workers/worker_notifications.py",
    "src/workers/worker_payments.py",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["UP031"]  # % formatting used intentionally in SQL parameter construction

[tool.ruff.lint.per-file-ignores]
"src/api/main.py" = ["E402"]  # late import for WebSocket router (avoids circular)
"src/utils/monitoring.py" = ["E402"]  # late import for uuid

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = false
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "src.api.routes.escalations",
    "src.api.routes.buildings",
    "src.api.routes.contractors",
    "src.api.routes.offers",
    "src.api.routes.agents",
    "src.api.routes.admin",
    "src.agents.support",
    "src.agents.router",
    "src.agents.pricing",
    "src.agents.payment",
    "src.agents.outreach",
    "src.agents.matching",
    "src.agents.architecture",
    "src.agents.vetting",
    "src.agents.notification",
    "src.databases.graph_store",
    "src.orchestration.graph",
]
disable_error_code = ["return-value", "assignment", "arg-type", "attr-defined", "index", "union-attr", "dict-item", "typeddict-item", "misc"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pytest-timeout>=2.4.0",
]
