# GitLeaks config for Groupio. Allowlist example env files (placeholders only, no real secrets).
# See https://github.com/gitleaks/gitleaks#configuration
title = "gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Allowlist .env.example files and known test fixtures (placeholder values only)"
commits = [
  "32238b5892ef0a9815a2f8ff746c64fcce67ab48",
]
paths = [
  '''(^|\/)\.env\.example$''',
  '''docker/\.env\.example$''',
  '''apps/mobile/\.env\.example$''',
  '''apps/admin/\.env\.example$''',
  '''apps/web/\.env\.example$''',
]
