name: Chromatic visual regression

on:
  push:
    branches: [main, dev]
  pull_request:
    paths:
      - "packages/ui/**"

jobs:
  chromatic:
    runs-on: ubuntu-latest
    env:
      # Expose as env so it can be checked in if: without triggering the
      # "Unrecognized named-value: secrets" validator error.
      CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Chromatic needs full history for change detection

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish to Chromatic
        # Skip gracefully when the project token has not been configured yet.
        # Add CHROMATIC_PROJECT_TOKEN to GitHub repo secrets once the project
        # is linked at https://www.chromatic.com/start.
        if: ${{ env.CHROMATIC_PROJECT_TOKEN != '' }}
        uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          workingDir: packages/ui
          buildScriptName: build-storybook
          # Auto-accept story changes on non-main branches (reviewers approve on PRs).
          autoAcceptChanges: "main"
          exitZeroOnChanges: true
