name: Chromatic visual regression

on:
  push:
    branches: [main, dev]
  pull_request:
    paths:
      - "packages/ui/**"

jobs:
  chromatic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Chromatic needs full history for change detection

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Publish to Chromatic
        # Skip gracefully when the project token has not been configured yet.
        # Add CHROMATIC_PROJECT_TOKEN to GitHub repo secrets once the project
        # is linked at https://www.chromatic.com/start.
        if: ${{ secrets.CHROMATIC_PROJECT_TOKEN != '' }}
        uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          workingDir: packages/ui
          buildScriptName: build-storybook
          # Auto-accept story changes on non-main branches (reviewers approve on PRs).
          autoAcceptChanges: "main"
          exitZeroOnChanges: true
