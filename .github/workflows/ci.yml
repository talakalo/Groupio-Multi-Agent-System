# CI: Lint, test, build, and security scan. Required for merge (branch protection).
# Runs on: push to main/dev, and all PRs targeting main or dev.
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'
  PNPM_VERSION: '9.0.0'

permissions:
  contents: read
  pull-requests: read

jobs:
  # ============================================
  # Code Quality Checks (must pass for merge)
  # ============================================

  backend-lint:
    name: Backend Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy

      - name: Run Ruff linter
        run: ruff check src/ tests/ --output-format=github
        continue-on-error: true

      - name: Run Ruff formatter check
        run: ruff format src/ tests/ --check
        continue-on-error: true

  frontend-lint:
    name: Frontend Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint
        continue-on-error: true

      - name: Run TypeScript type check
        run: pnpm typecheck
        continue-on-error: true

  # ============================================
  # Security Scanning
  # ============================================

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Run GitLeaks (secret scanning)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: critical
        continue-on-error: true

  # ============================================
  # Backend Tests
  # ============================================

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: [backend-lint]

    env:
      REDIS_URL: redis://localhost:6379
      TESTING: 'true'
      ENVIRONMENT: 'testing'
      ANTHROPIC_API_KEY: 'test-key'
      OPENAI_API_KEY: 'test-key'
      JWT_SECRET_KEY: 'test-secret-key-for-ci-testing-only'

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests
        run: |
          pytest tests/unit/ -v --cov=src --cov-report=xml --cov-report=term-missing

      - name: Run integration tests
        env:
          REDIS_URL: redis://localhost:6379
          TESTING: 'true'
          ENVIRONMENT: 'testing'
          ANTHROPIC_API_KEY: 'test-key'
          OPENAI_API_KEY: 'test-key'
          JWT_SECRET_KEY: 'test-secret-key-for-ci-testing-only'
        run: |
          pytest tests/integration/ -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ============================================
  # Frontend Tests
  # ============================================

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: [frontend-lint]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          flags: frontend
          name: frontend-coverage
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ============================================
  # Build Verification
  # ============================================

  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [frontend-lint, backend-lint]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: https://api.groupio.co.il
          NEXT_PUBLIC_APP_URL: https://groupio.co.il
          NEXT_PUBLIC_SUPABASE_URL: https://supabase.groupio.co.il
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-key

  # ============================================
  # Docker Build
  # ============================================

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend-test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: false
          tags: groupio-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================
  # E2E Tests (only on main/dev branches)
  # ============================================

  e2e-test:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [frontend-test, backend-test]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @groupio/web exec playwright install --with-deps chromium

      - name: Build web app
        run: pnpm --filter @groupio/web build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-key

      # When E2E is stable, set continue-on-error: false so failures fail CI (see CODE_REVIEW_PLAN Phase 3.6).
      - name: Run E2E tests
        run: pnpm --filter @groupio/web exec playwright test --project=chromium
        env:
          CI: true
        continue-on-error: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  # ============================================
  # Status Check (for branch protection)
  # ============================================

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test, build, security-scan, docker-build]
    if: always()

    steps:
      - name: Check all required jobs passed
        run: |
          if [[ "${{ needs.backend-test.result }}" != "success" ]]; then echo "❌ Backend tests failed"; exit 1; fi
          if [[ "${{ needs.frontend-test.result }}" != "success" ]]; then echo "❌ Frontend tests failed"; exit 1; fi
          if [[ "${{ needs.build.result }}" != "success" ]]; then echo "❌ Build failed"; exit 1; fi
          if [[ "${{ needs.security-scan.result }}" != "success" ]]; then echo "❌ Security scan failed"; exit 1; fi
          if [[ "${{ needs.docker-build.result }}" != "success" ]]; then echo "❌ Docker build failed"; exit 1; fi
          echo "✅ All required checks passed!"
