# CI: Lint, test, build, and security scan. Required for merge (branch protection).
# Runs on: push to main/dev, and all PRs targeting main or dev.
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'
  PNPM_VERSION: '9.0.0'

permissions:
  contents: read
  pull-requests: read

jobs:
  # ============================================
  # Code Quality Checks (must pass for merge)
  # ============================================

  backend-lint:
    name: Backend Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install "ruff==0.15.0" mypy

      - name: Run Ruff linter
        run: ruff check src/ tests/ --output-format=github

      - name: Run Ruff formatter check
        run: ruff format src/ tests/ --check


  backend-mypy:
    name: Backend Type Check (Mypy)
    runs-on: ubuntu-latest
    needs: [backend-lint]

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install mypy and stubs
        run: |
          python -m pip install --upgrade pip
          pip install "mypy>=1.7.0" types-redis

      - name: Run mypy
        run: mypy src/ --ignore-missing-imports --strict-optional

  frontend-lint:
    name: Frontend Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@c5ba7f7862a0f64c1b1a05fbac13e0b8e86ba08c # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

      - name: Run TypeScript type check
        run: pnpm typecheck

  # ============================================
  # Security Scanning
  # ============================================

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Run GitLeaks (secret scanning)
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # NOTE: dependency-review requires GitHub Advanced Security (not available).
  # Re-enable when Advanced Security is activated on the repository.
  # See: https://github.com/talakalo/Groupio-Multi-Agent-System/settings/security_analysis

  # ============================================
  # Backend Tests
  # ============================================

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-mypy]

    env:
      REDIS_URL: redis://localhost:6379
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
      USE_LOCAL_POSTGRES: 'true'
      TESTING: 'true'
      ENVIRONMENT: 'testing'
      ANTHROPIC_API_KEY: 'test-key'
      OPENAI_API_KEY: 'test-key'
      JWT_SECRET_KEY: 'test-secret-key-for-ci-testing-only'

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests with coverage enforcement
        run: |
          pytest tests/ --cov=src --cov-fail-under=80 --cov-report=xml --cov-report=term-missing

      - name: Run integration tests
        env:
          REDIS_URL: redis://localhost:6379
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          TESTING: 'true'
          ENVIRONMENT: 'testing'
          ANTHROPIC_API_KEY: 'test-key'
          OPENAI_API_KEY: 'test-key'
          JWT_SECRET_KEY: 'test-secret-key-for-ci-testing-only'
        run: |
          pytest tests/integration/ -v --timeout=30 --no-cov

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          files: ./coverage.xml
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ============================================
  # Frontend Tests
  # ============================================

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: [frontend-lint]

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@c5ba7f7862a0f64c1b1a05fbac13e0b8e86ba08c # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm turbo test

      - name: Upload coverage
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          flags: frontend
          name: frontend-coverage
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ============================================
  # Build Verification
  # ============================================

  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [frontend-lint, backend-lint]

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@c5ba7f7862a0f64c1b1a05fbac13e0b8e86ba08c # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate TypeScript types from FastAPI OpenAPI schema
        run: |
          # Start the backend briefly in the background to expose the schema.
          # Uses stub env vars — no real DB or LLM connections are made.
          TESTING=true ENVIRONMENT=testing JWT_SECRET_KEY=ci-test-key             python -m uvicorn src.api.main:app --host 127.0.0.1 --port 8099 &
          BACKEND_PID=$!
          sleep 8
          npx --yes openapi-typescript http://127.0.0.1:8099/openapi.json             -o packages/types/src/generated.ts
          kill $BACKEND_PID || true
        continue-on-error: true  # non-blocking until types are wired up end-to-end
        env:
          PYTHONPATH: .

      - name: Build all packages
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: https://api.groupio.co.il
          NEXT_PUBLIC_APP_URL: https://groupio.co.il
          NEXT_PUBLIC_SUPABASE_URL: https://supabase.groupio.co.il
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-key

  # ============================================
  # Docker Build
  # ============================================

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend-test]

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: false
          tags: groupio-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================
  # E2E Tests (only on main/dev branches)
  # ============================================

  e2e-test:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [frontend-test, backend-test]
    if: >
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/dev' ||
      (github.event_name == 'pull_request' &&
       (github.base_ref == 'main' || github.base_ref == 'dev'))
    permissions:
      contents: read
      checks: write  # required for publish-unit-test-result-action to list/create check runs

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@c5ba7f7862a0f64c1b1a05fbac13e0b8e86ba08c # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @groupio/web exec playwright install --with-deps chromium

      - name: Build web app
        run: pnpm --filter @groupio/web build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-key

      - name: Run E2E tests
        run: pnpm --filter @groupio/web exec playwright test --project=chromium
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

      - name: Publish E2E test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@12fa20e14d449d310778f2d0af1e3b2f57dde2a7 # v2
        with:
          files: apps/web/playwright-report/junit-e2e.xml
          check_name: E2E Test Results
          comment_mode: "off"

  # ============================================
  # Status Check (for branch protection)
  # ============================================

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test, build, security-scan, docker-build, backend-mypy]
    if: always()

    steps:
      - name: Check all required jobs passed
        run: |
          if [[ "${{ needs.backend-test.result }}" != "success" ]]; then echo "❌ Backend tests failed"; exit 1; fi
          if [[ "${{ needs.frontend-test.result }}" != "success" ]]; then echo "❌ Frontend tests failed"; exit 1; fi
          if [[ "${{ needs.build.result }}" != "success" ]]; then echo "❌ Build failed"; exit 1; fi
          if [[ "${{ needs.security-scan.result }}" != "success" ]]; then echo "❌ Security scan failed"; exit 1; fi
          if [[ "${{ needs.docker-build.result }}" != "success" ]]; then echo "❌ Docker build failed"; exit 1; fi
          echo "✅ All required checks passed!"
