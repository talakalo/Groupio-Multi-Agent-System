# Deploy: Backend (Docker), Web/Admin (Vercel), Mobile (EAS). Runs after CI succeeds or via manual dispatch.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'
  PNPM_VERSION: '9'

permissions:
  contents: read
  deployments: write

jobs:
  # ============================================
  # Determine deployment environment
  # ============================================

  setup:
    name: Setup Deployment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      should_deploy: ${{ steps.env.outputs.should_deploy }}

    steps:
      - name: Determine environment
        id: env
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
            echo "should_deploy=true" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            if [[ "${{ github.event.workflow_run.conclusion }}" != "success" ]]; then
              echo "environment=none" >> $GITHUB_OUTPUT
              echo "should_deploy=false" >> $GITHUB_OUTPUT
            else
              ref="${{ github.event.workflow_run.head_branch }}"
              if [[ "$ref" == "main" ]]; then
                echo "environment=production" >> $GITHUB_OUTPUT
                echo "should_deploy=true" >> $GITHUB_OUTPUT
              elif [[ "$ref" == "dev" ]]; then
                echo "environment=staging" >> $GITHUB_OUTPUT
                echo "should_deploy=true" >> $GITHUB_OUTPUT
              else
                echo "environment=none" >> $GITHUB_OUTPUT
                echo "should_deploy=false" >> $GITHUB_OUTPUT
              fi
            fi
          else
            echo "environment=none" >> $GITHUB_OUTPUT
            echo "should_deploy=false" >> $GITHUB_OUTPUT
          fi

      - name: Log deployment info
        run: |
          echo "## Deployment Configuration" >> $GITHUB_STEP_SUMMARY
          echo "| Setting | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | ${{ github.ref_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | ${{ steps.env.outputs.environment }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Should Deploy | ${{ steps.env.outputs.should_deploy }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Trigger | ${{ github.event_name }} |" >> $GITHUB_STEP_SUMMARY

  # ============================================
  # Deploy Backend
  # ============================================

  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    needs: [setup]
    if: needs.setup.outputs.should_deploy == 'true'
    environment: ${{ needs.setup.outputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Check required secrets
        id: check-secrets
        run: |
          if [[ -z "${{ secrets.DOCKER_USERNAME }}" ]] || [[ -z "${{ secrets.DOCKER_PASSWORD }}" ]]; then
            echo "has_docker_secrets=false" >> $GITHUB_OUTPUT
            echo "::warning::Docker secrets not configured - skipping backend deployment"
          else
            echo "has_docker_secrets=true" >> $GITHUB_OUTPUT
          fi
          if [[ -z "${{ secrets.DEPLOY_HOST }}" ]] || [[ -z "${{ secrets.DEPLOY_SSH_KEY }}" ]]; then
            echo "has_deploy_secrets=false" >> $GITHUB_OUTPUT
            echo "::warning::Deploy secrets not configured - skipping server deployment"
          else
            echo "has_deploy_secrets=true" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        if: steps.check-secrets.outputs.has_docker_secrets == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        if: steps.check-secrets.outputs.has_docker_secrets == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        if: steps.check-secrets.outputs.has_docker_secrets == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: |
            ${{ vars.DOCKER_REGISTRY }}/groupio-backend:${{ github.sha }}
            ${{ vars.DOCKER_REGISTRY }}/groupio-backend:${{ needs.setup.outputs.environment }}
            ${{ vars.DOCKER_REGISTRY }}/groupio-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            ENVIRONMENT=${{ needs.setup.outputs.environment }}

      - name: Deploy to server
        if: steps.check-secrets.outputs.has_deploy_secrets == 'true'
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/groupio
            docker compose pull backend
            docker compose up -d backend
            docker system prune -f

      - name: Smoke test — verify deployment health
        if: steps.check-secrets.outputs.has_deploy_secrets == 'true'
        run: |
          echo "Waiting 15s for service to initialise..."
          sleep 15
          HEALTH_URL="https://api.groupio.co.il/api/v1/health/live"
          for i in 1 2 3 4 5; do
            echo "Health check attempt ${i}/5..."
            if curl -sf --max-time 10 "${HEALTH_URL}"; then
              echo "✅ Service is healthy"
              exit 0
            fi
            echo "Attempt ${i} failed — retrying in 5s"
            sleep 5
          done
          echo "❌ Health check failed after 5 attempts — deployment may be unhealthy"
          exit 1

      - name: Deployment summary
        run: |
          echo "## Backend Deployment" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Build | ${{ steps.check-secrets.outputs.has_docker_secrets == 'true' && '✅ Completed' || '⏭️ Skipped (no secrets)' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Server Deploy | ${{ steps.check-secrets.outputs.has_deploy_secrets == 'true' && '✅ Completed' || '⏭️ Skipped (no secrets)' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Smoke Test | ${{ steps.check-secrets.outputs.has_deploy_secrets == 'true' && '✅ Passed' || '⏭️ Skipped (no secrets)' }} |" >> $GITHUB_STEP_SUMMARY

  # ============================================
  # Deploy Web App to Vercel
  # ============================================

  deploy-web:
    name: Deploy Web App
    runs-on: ubuntu-latest
    needs: [setup]
    if: needs.setup.outputs.should_deploy == 'true'
    environment: ${{ needs.setup.outputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Check Vercel token
        id: check-vercel
        run: |
          if [[ -z "${{ secrets.VERCEL_TOKEN }}" ]]; then
            echo "has_vercel=false" >> $GITHUB_OUTPUT
            echo "::warning::Vercel token not configured - skipping web deployment"
          else
            echo "has_vercel=true" >> $GITHUB_OUTPUT
          fi

      - name: Setup pnpm
        if: steps.check-vercel.outputs.has_vercel == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        if: steps.check-vercel.outputs.has_vercel == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        if: steps.check-vercel.outputs.has_vercel == 'true'
        run: pnpm install

      - name: Install Vercel CLI
        if: steps.check-vercel.outputs.has_vercel == 'true'
        run: npm install -g vercel@latest

      - name: Pull Vercel environment
        if: steps.check-vercel.outputs.has_vercel == 'true'
        run: vercel pull --yes --environment=${{ needs.setup.outputs.environment == 'production' && 'production' || 'preview' }} --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: apps/web

      - name: Build project
        if: steps.check-vercel.outputs.has_vercel == 'true'
        run: vercel build ${{ needs.setup.outputs.environment == 'production' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: apps/web

      - name: Deploy to Vercel
        if: steps.check-vercel.outputs.has_vercel == 'true'
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt ${{ needs.setup.outputs.environment == 'production' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> $GITHUB_OUTPUT
        working-directory: apps/web

      - name: Deployment summary
        run: |
          echo "## Web App Deployment" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ steps.check-vercel.outputs.has_vercel }}" == "true" ]]; then
            echo "✅ Deployed to: ${{ steps.deploy.outputs.url || 'N/A' }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "⏭️ Skipped - Vercel token not configured" >> $GITHUB_STEP_SUMMARY
          fi

  # ============================================
  # Deploy Admin Dashboard to Vercel
  # ============================================

  deploy-admin:
    name: Deploy Admin Dashboard
    runs-on: ubuntu-latest
    needs: [setup]
    if: needs.setup.outputs.should_deploy == 'true'
    environment: ${{ needs.setup.outputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Check Vercel token
        id: check-vercel
        run: |
          if [[ -z "${{ secrets.VERCEL_TOKEN }}" ]]; then
            echo "has_vercel=false" >> $GITHUB_OUTPUT
            echo "::warning::Vercel token not configured - skipping admin deployment"
          else
            echo "has_vercel=true" >> $GITHUB_OUTPUT
          fi

      - name: Setup pnpm
        if: steps.check-vercel.outputs.has_vercel == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        if: steps.check-vercel.outputs.has_vercel == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        if: steps.check-vercel.outputs.has_vercel == 'true'
        run: pnpm install

      - name: Install Vercel CLI
        if: steps.check-vercel.outputs.has_vercel == 'true'
        run: npm install -g vercel@latest

      - name: Pull Vercel environment
        if: steps.check-vercel.outputs.has_vercel == 'true'
        run: vercel pull --yes --environment=${{ needs.setup.outputs.environment == 'production' && 'production' || 'preview' }} --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: apps/admin

      - name: Build project
        if: steps.check-vercel.outputs.has_vercel == 'true'
        run: vercel build ${{ needs.setup.outputs.environment == 'production' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: apps/admin

      - name: Deploy to Vercel
        if: steps.check-vercel.outputs.has_vercel == 'true'
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt ${{ needs.setup.outputs.environment == 'production' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> $GITHUB_OUTPUT
        working-directory: apps/admin

      - name: Deployment summary
        run: |
          echo "## Admin Dashboard Deployment" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ steps.check-vercel.outputs.has_vercel }}" == "true" ]]; then
            echo "✅ Deployed to: ${{ steps.deploy.outputs.url || 'N/A' }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "⏭️ Skipped - Vercel token not configured" >> $GITHUB_STEP_SUMMARY
          fi

  # ============================================
  # Deploy Mobile App (Production only)
  # ============================================

  deploy-mobile:
    name: Deploy Mobile App
    runs-on: ubuntu-latest
    needs: [setup]
    if: needs.setup.outputs.should_deploy == 'true' && needs.setup.outputs.environment == 'production'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Check Expo token
        id: check-expo
        run: |
          if [[ -z "${{ secrets.EXPO_TOKEN }}" ]]; then
            echo "has_expo=false" >> $GITHUB_OUTPUT
            echo "::warning::Expo token not configured - skipping mobile deployment"
          else
            echo "has_expo=true" >> $GITHUB_OUTPUT
          fi

      - name: Setup pnpm
        if: steps.check-expo.outputs.has_expo == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        if: steps.check-expo.outputs.has_expo == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        if: steps.check-expo.outputs.has_expo == 'true'
        run: pnpm install

      - name: Setup EAS
        if: steps.check-expo.outputs.has_expo == 'true'
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build and submit
        if: steps.check-expo.outputs.has_expo == 'true'
        working-directory: apps/mobile
        run: |
          eas build --platform all --profile production --non-interactive
          eas submit --platform all --profile production --non-interactive

      - name: Deployment summary
        run: |
          echo "## Mobile App Deployment" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ steps.check-expo.outputs.has_expo }}" == "true" ]]; then
            echo "✅ Build submitted to App Store and Play Store" >> $GITHUB_STEP_SUMMARY
          else
            echo "⏭️ Skipped - Expo token not configured" >> $GITHUB_STEP_SUMMARY
          fi

  # ============================================
  # Run Database Migrations
  # ============================================

  migrate:
    name: Run Migrations
    runs-on: ubuntu-latest
    needs: [setup, deploy-backend]
    if: needs.setup.outputs.should_deploy == 'true'
    environment: ${{ needs.setup.outputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Check database URL
        id: check-db
        run: |
          if [[ -z "${{ secrets.DATABASE_URL }}" ]]; then
            echo "has_db=false" >> $GITHUB_OUTPUT
            echo "::warning::Database URL not configured - skipping migrations"
          else
            echo "has_db=true" >> $GITHUB_OUTPUT
          fi

      - name: Set up Python
        if: steps.check-db.outputs.has_db == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        if: steps.check-db.outputs.has_db == 'true'
        run: |
          pip install alembic psycopg2-binary

      - name: Run migrations
        if: steps.check-db.outputs.has_db == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          alembic upgrade head

      - name: Migration summary
        run: |
          echo "## Database Migrations" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ steps.check-db.outputs.has_db }}" == "true" ]]; then
            echo "✅ Migrations completed successfully" >> $GITHUB_STEP_SUMMARY
          else
            echo "⏭️ Skipped - Database URL not configured" >> $GITHUB_STEP_SUMMARY
          fi

  # ============================================
  # Notify on Completion
  # ============================================

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [setup, deploy-backend, deploy-web, deploy-admin]
    if: always()

    steps:
      - name: Check Slack webhook
        id: check-slack
        run: |
          if [[ -z "${{ secrets.SLACK_WEBHOOK_URL }}" ]]; then
            echo "has_slack=false" >> $GITHUB_OUTPUT
          else
            echo "has_slack=true" >> $GITHUB_OUTPUT
          fi

      - name: Send Slack notification
        if: steps.check-slack.outputs.has_slack == 'true'
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          channel: '#deployments'
          fields: repo,message,commit,author,action,eventName,workflow
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Final deployment summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend | ${{ needs.deploy-backend.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Web App | ${{ needs.deploy-web.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Admin Dashboard | ${{ needs.deploy-admin.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ needs.setup.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
