name: Database Backup

on:
  schedule:
    # Daily at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Manual trigger reason'
        required: false
        default: 'Manual backup'

env:
  BACKUP_RETENTION_DAYS: 30

jobs:
  backup:
    name: Backup PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pg_dump client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

      - name: Create backup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PGPASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          BACKUP_FILE="backup_${TIMESTAMP}.sql.gz"

          echo "Starting backup: ${BACKUP_FILE}"

          # Parse DATABASE_URL for pg_dump
          pg_dump "$DATABASE_URL" | gzip > "${BACKUP_FILE}"

          echo "Backup size: $(du -sh ${BACKUP_FILE} | cut -f1)"
          echo "BACKUP_FILE=${BACKUP_FILE}" >> $GITHUB_ENV

      - name: Upload to S3
        if: ${{ env.AWS_S3_BUCKET != '' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION || 'eu-west-1' }}
        run: |
          aws s3 cp "${BACKUP_FILE}" "s3://${AWS_S3_BUCKET}/db-backups/${BACKUP_FILE}"
          echo "Uploaded to s3://${AWS_S3_BUCKET}/db-backups/${BACKUP_FILE}"

          # Prune backups older than BACKUP_RETENTION_DAYS
          CUTOFF=$(date -d "${BACKUP_RETENTION_DAYS} days ago" +%Y%m%d 2>/dev/null || \
                   date -v-${BACKUP_RETENTION_DAYS}d +%Y%m%d)
          echo "Pruning backups older than ${CUTOFF}"
          aws s3 ls "s3://${AWS_S3_BUCKET}/db-backups/" | while read -r line; do
            FILE_DATE=$(echo "$line" | awk '{print $4}' | grep -oP '\d{8}' | head -1)
            FILE_NAME=$(echo "$line" | awk '{print $4}')
            if [[ -n "$FILE_DATE" && "$FILE_DATE" < "$CUTOFF" ]]; then
              aws s3 rm "s3://${AWS_S3_BUCKET}/db-backups/${FILE_NAME}"
              echo "Deleted old backup: ${FILE_NAME}"
            fi
          done

      - name: Upload as artifact (fallback when S3 not configured)
        if: ${{ env.AWS_S3_BUCKET == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: ${{ env.BACKUP_RETENTION_DAYS }}

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Database backup failed — ${new Date().toISOString().split('T')[0]}`,
              body: `Automated daily backup failed. Run: ${context.runId}\n\nPlease investigate and run a manual backup immediately.`,
              labels: ['incident', 'database'],
            });
