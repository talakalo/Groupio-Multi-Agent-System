# Prometheus configuration for Groupio production monitoring.
#
# Usage:
#   docker run -p 9090:9090 \
#     -v $(pwd)/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml \
#     prom/prometheus
#
# Or via docker-compose (see docker/docker-compose.prod.yml).
#
# NOTE: The scrape jobs for frontend, redis-exporter, node-exporter, and
# postgres-exporter are commented out because those services are NOT in
# docker/docker-compose.yml. Prometheus would log scrape errors every 15 s
# for each missing target. Uncomment each block when you add the corresponding
# sidecar to the compose file.

global:
  scrape_interval: 15s      # How often to scrape targets
  evaluation_interval: 15s  # How often to evaluate alerting rules
  scrape_timeout: 10s

  # Attach these labels to every time series collected from this Prometheus instance.
  external_labels:
    environment: production
    app: groupio

# Load alerting rules from the monitoring/ directory.
rule_files:
  - "alerts.yml"

# Alertmanager integration — update the address to your Alertmanager instance.
# Comment out if you have not deployed Alertmanager yet.
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Scrape configurations.
scrape_configs:
  # Prometheus scrapes itself for meta-monitoring.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # FastAPI backend — /metrics requires X-API-Key or Authorization: Bearer.
  # Set bearer_token to one of API_KEYS, or use bearer_token_file for secrets.
  # For local dev with API_KEYS=[], auth is skipped and no bearer_token needed.
  - job_name: groupio-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
    # bearer_token: "<one-of-API_KEYS>"  # Uncomment and set for auth
    # bearer_token_file: /run/secrets/metrics_api_key  # Or use file
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: groupio-api

  # ── Optional scrape jobs (not in current compose) ────────────────────────────
  # Add the corresponding sidecar service to docker-compose.yml before enabling.

  # Next.js frontend — uncomment when `frontend` service is added to compose and
  # next-prometheus (or similar) is configured to export /api/metrics.
  # - job_name: groupio-frontend
  #   metrics_path: /api/metrics
  #   static_configs:
  #     - targets: ["frontend:3000"]
  #   relabel_configs:
  #     - source_labels: [__address__]
  #       target_label: instance
  #       replacement: groupio-frontend

  # Redis exporter — https://github.com/oliver006/redis_exporter
  # Add `redis-exporter` service to compose before enabling.
  # - job_name: redis
  #   static_configs:
  #     - targets: ["redis-exporter:9121"]

  # Node exporter — host-level CPU, memory, disk, network metrics.
  # Add `node-exporter` service to compose before enabling.
  # - job_name: node
  #   static_configs:
  #     - targets: ["node-exporter:9100"]

  # PostgreSQL exporter — https://github.com/prometheus-community/postgres_exporter
  # Add `postgres-exporter` service to compose before enabling.
  # - job_name: postgres
  #   static_configs:
  #     - targets: ["postgres-exporter:9187"]
